<style>
  :root {
    --bg-img: url('background.jpg'); /* đổi tên/link ảnh nền của bạn ở đây */
    --card-bg: rgba(255,255,255,0.055);
    --card-border: rgba(255,255,255,0.1);
    --accent-soft: rgba(255,255,255,0.12);
    --text: #f5f5f6;
    --muted: #9a9aa2;
    --radius-lg: 18px;
    --radius-md: 13px;
    --radius-sm: 10px;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    box-sizing: border-box;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background: var(--bg-img) center/cover no-repeat fixed, #0c0c0f;
    min-height: 100%;
  }
  .overlay {
    min-height: 100%;
    background: linear-gradient(180deg, rgba(8,8,10,0.72), rgba(8,8,10,0.88));
    padding: 20px 14px 36px;
  }

  .profile {
    max-width: 760px;
    margin: 0 auto 10px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    text-align: left;
    gap: 6px;
  }
  .profile .avatar {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid rgba(255,255,255,0.18);
  }
  .profile .name {
    font-weight: 800;
    font-size: 1.05rem;
    letter-spacing: 0.3px;
    color: var(--text);
    line-height: 1.15;
  }
  .profile .caption {
    font-size: 0.76rem;
    color: var(--muted);
    line-height: 1.3;
    max-width: 420px;
  }
  .profile .views {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 0.7rem;
    color: var(--muted);
    margin-top: 1px;
  }
  .profile .views svg { width: 12px; height: 12px; opacity: 0.8; }

  /* ---- About Me ---- */
  .about {
    max-width: 760px;
    margin: 0 auto 16px;
  }
  .about .section-head {
    display: flex;
    align-items: center;
    gap: 6px;
    margin: 0 0 7px 2px;
  }
  .about .section-head .bar {
    width: 3px;
    height: 11px;
    border-radius: 3px;
    background: linear-gradient(180deg, #ffffff, #9a9aa2);
  }
  .about h2 {
    font-size: 0.7rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text);
    margin: 0;
  }
  .about .links {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
  }
  .about .links a {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 6px 12px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 999px;
    color: var(--text);
    text-decoration: none;
    font-size: 0.74rem;
    font-weight: 600;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .about .links a:hover {
    background: rgba(255,255,255,0.12);
    border-color: rgba(255,255,255,0.22);
  }

  .search {
    max-width: 760px;
    margin: 0 auto 16px;
  }
  .search input {
    width: 100%;
    padding: 9px 14px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--card-border);
    background: var(--card-bg);
    color: var(--text);
    font-size: 0.88rem;
    outline: none;
    transition: border-color 0.15s ease;
  }
  .search input:focus { border-color: rgba(255,255,255,0.3); }
  .search input::placeholder { color: var(--muted); }

  .section {
    max-width: 760px;
    margin: 0 auto 14px;
  }
  .section .section-head {
    display: flex;
    align-items: center;
    gap: 6px;
    margin: 0 0 7px 2px;
  }
  .section .section-head .bar {
    width: 3px;
    height: 11px;
    border-radius: 3px;
    background: linear-gradient(180deg, #ffffff, #9a9aa2);
  }
  .section h2 {
    font-size: 0.7rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text);
    margin: 0;
  }

  .grid {
    display: flex;
    flex-direction: column;
    gap: 6px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: var(--radius-lg);
    padding: 8px;
    backdrop-filter: blur(10px);
  }
  .card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: var(--radius-md);
    padding: 8px 10px;
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 10px;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .card:hover {
    border-color: rgba(255,255,255,0.22);
    background: rgba(255,255,255,0.08);
  }
  .card .icon {
    width: 34px; height: 34px;
    flex: 0 0 auto;
    border-radius: 9px;
    background: var(--accent-soft);
    display: flex; align-items: center; justify-content: center;
    font-size: 1rem;
    overflow: hidden;
  }
  .card .icon img { width: 100%; height: 100%; object-fit: cover; }
  .card .info {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 1px;
  }
  .card h3 {
    margin: 0;
    font-size: 0.82rem;
    font-weight: 700;
    letter-spacing: 0.1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card .meta { color: var(--muted); font-size: 0.66rem; }
  .card a.dl {
    flex: 0 0 auto;
    background: rgba(255,255,255,0.14);
    border: 1px solid rgba(255,255,255,0.16);
    color: var(--text);
    text-decoration: none;
    padding: 6px 12px;
    border-radius: 8px;
    font-weight: 700;
    font-size: 0.7rem;
    letter-spacing: 0.2px;
    transition: background 0.15s ease;
  }
  .card a.dl:hover { background: rgba(255,255,255,0.24); }
  .card a.dl:active { opacity: 0.8; }

  footer {
    max-width: 760px;
    margin: 16px auto 0;
    text-align: left;
    color: var(--muted);
    font-size: 0.66rem;
  }

  .empty { text-align: center; color: var(--muted); margin-top: 24px; display: none; }
</style>
