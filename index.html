<link rel="icon" type="image/jpeg" href="https://raw.githubusercontent.com/nguyenls3005-cell/Ls-web/main/assets/IMG_0053.jpeg">
<style>
  :root {
    --bg-img: url('background.jpg');
    --card-bg: rgba(255,255,255,0.055);
    --card-border: rgba(255,255,255,0.1);
    --accent-soft: rgba(255,255,255,0.12);
    --text: #f5f5f6;
    --muted: #9a9aa2;
    --radius-lg: 18px;
    --radius-md: 13px;
    --radius-sm: 10px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background: var(--bg-img) center/cover no-repeat fixed, #0c0c0f;
    min-height: 100%;
  }
  .overlay {
    min-height: 100vh;
    background: linear-gradient(180deg, rgba(8,8,10,0.72), rgba(8,8,10,0.88));
    padding: 20px 14px 36px;
    padding-top: calc(20px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(36px + env(safe-area-inset-bottom, 0px));
  }
  .profile {
    max-width: 760px; margin: 0 auto 10px;
    display: flex; flex-direction: column;
    align-items: flex-start; text-align: left; gap: 6px;
  }
  .profile .avatar {
    width: 48px; height: 48px; border-radius: 50%;
    object-fit: cover; border: 2px solid rgba(255,255,255,0.18);
    background: rgba(255,255,255,0.1);
    display: block;
  }
  .profile .name {
    font-weight: 800; font-size: 1.05rem;
    letter-spacing: 0.3px; color: var(--text); line-height: 1.15;
  }
  .profile .caption {
    font-size: 0.76rem; color: var(--muted);
    line-height: 1.3; max-width: 420px;
  }
  .profile .views {
    display: flex; align-items: center; gap: 4px;
    font-size: 0.7rem; color: var(--muted); margin-top: 1px;
  }
  .profile .views svg { width: 12px; height: 12px; opacity: 0.8; }

  .about { max-width: 760px; margin: 0 auto 16px; }
  .about .section-head,
  .section .section-head {
    display: flex; align-items: center; gap: 6px; margin: 0 0 7px 2px;
  }
  .about .section-head .bar,
  .section .section-head .bar {
    width: 3px; height: 11px; border-radius: 3px;
    background: linear-gradient(180deg, #ffffff, #9a9aa2);
  }
  .about h2, .section h2 {
    font-size: 0.7rem; font-weight: 800;
    text-transform: uppercase; letter-spacing: 1px;
    color: var(--text); margin: 0;
  }
  .about .links { display: flex; flex-wrap: wrap; gap: 7px; }
  .about .links a {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 6px 12px; background: var(--card-bg);
    border: 1px solid var(--card-border); border-radius: 999px;
    color: var(--text); text-decoration: none;
    font-size: 0.74rem; font-weight: 600;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .about .links a:hover {
    background: rgba(255,255,255,0.12);
    border-color: rgba(255,255,255,0.22);
  }

  .search { max-width: 760px; margin: 0 auto 16px; }
  .search input {
    width: 100%; padding: 9px 14px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--card-border);
    background: var(--card-bg); color: var(--text);
    font-size: 0.88rem; outline: none;
    transition: border-color 0.15s ease;
  }
  .search input:focus { border-color: rgba(255,255,255,0.3); }
  .search input::placeholder { color: var(--muted); }

  .section { max-width: 760px; margin: 0 auto 14px; }

  .grid {
    display: flex; flex-direction: column; gap: 6px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: var(--radius-lg);
    padding: 8px;
    backdrop-filter: blur(10px);
  }
  .card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: var(--radius-md);
    padding: 8px 10px;
    display: flex; flex-direction: row; align-items: center; gap: 10px;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .card:hover {
    border-color: rgba(255,255,255,0.22);
    background: rgba(255,255,255,0.08);
  }
  .card .icon {
    width: 34px; height: 34px; flex: 0 0 auto;
    border-radius: 9px; background: var(--accent-soft);
    display: flex; align-items: center; justify-content: center;
    font-size: 1rem; overflow: hidden;
  }
  .card .icon img { width: 100%; height: 100%; object-fit: cover; }
  .card .info {
    flex: 1 1 auto; min-width: 0;
    display: flex; flex-direction: column; gap: 1px;
  }
  .card h3 {
    margin: 0; font-size: 0.82rem; font-weight: 700;
    letter-spacing: 0.1px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .card .meta { color: var(--muted); font-size: 0.66rem; }
  .card a.dl {
    flex: 0 0 auto;
    background: rgba(255,255,255,0.14);
    border: 1px solid rgba(255,255,255,0.16);
    color: var(--text); text-decoration: none;
    padding: 6px 12px; border-radius: 8px;
    font-weight: 700; font-size: 0.7rem;
    letter-spacing: 0.2px;
    transition: background 0.15s ease;
  }
  .card a.dl:hover { background: rgba(255,255,255,0.24); }
  .card a.dl:active { opacity: 0.8; }

  .empty { text-align: center; color: var(--muted); margin-top: 24px; display: none; }
</style>
</head>
<body>
<div class="overlay">

  <div class="profile">
    <img class="avatar" alt="avatar" src="https://raw.githubusercontent.com/nguyenls3005-cell/Ls-web/main/assets/IMG_0053.jpeg?v=2">
    <div class="name">LSNguyen</div>
    <div class="caption">Web của LSNguyen, nơi đăng tải những thứ thú vị</div>
    <div class="views">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
      <span id="viewCount">—</span> lượt xem
    </div>
  </div>

  <div class="about">
    <div class="section-head"><span class="bar"></span><h2>About Me</h2></div>
    <div class="links">
      <a href="https://x.com/nguyenls3005?s=11" target="_blank" rel="noopener">1. X</a>
      <a href="https://www.facebook.com/share/19Uc3TbjoZ/?mibextid=wwXIfr" target="_blank" rel="noopener">2. Facebook</a>
      <a href="https://github.com/nguyenls3005-cell" target="_blank" rel="noopener">3. Github</a>
    </div>
  </div>

  <div class="search">
    <input id="searchInput" type="text" placeholder="Tìm app...">
  </div>

  <div class="section">
    <div class="section-head"><span class="bar"></span><h2>IPA Apps</h2></div>
    <div class="grid" data-group="ipa" id="ipaGrid"></div>
  </div>

  <div class="section">
    <div class="section-head"><span class="bar"></span><h2>Other</h2></div>
    <div class="grid" data-group="other" id="otherGrid"></div>
  </div>

  <p class="empty" id="emptyMsg">Không tìm thấy app nào.</p>

</div>

<script>
  const ICON = 'https://raw.githubusercontent.com/nguyenls3005-cell/Ls-web/main/assets/';

  const IPA_APPS = [
    { name: '3105 2.1 Beta 2', icon: '<img src="' + ICON + 'IMG_0019.png?v=2">', version: '2.1 Beta 2', size: '7,1 MB', url: 'https://github.com/nguyenls3005-cell/Ls-web/releases/download/Test/3105-2.1-beta2-unsigned.ipa' },
    { name: 'FilzaSlop', icon: '<img src="' + ICON + 'IMG_0027.png?v=2">', version: '', size: '14,9 MB', url: 'https://u.pone.rs/azgscqjk.ipa' },
    { name: 'Fila', icon: '<img src="' + ICON + 'IMG_0344.png?v=2">', version: '', size: '24,3 MB', url: 'https://u.pone.rs/toydrwrs.ipa' },
    { name: 'EnsSign', icon: '<img src="' + ICON + 'IMG_0347.png?v=2">', version: '', size: '11,3 MB', url: 'https://u.pone.rs/dhkzrwjv.ipa' },
    { name: 'Esign', icon: '<img src="' + ICON + 'IMG_0054.png?v=2">', version: '', size: '7,5 MB', url: 'https://u.pone.rs/gmubopzc.ipa' },
    { name: 'ZSign', icon: '<img src="' + ICON + 'IMG_0346.png?v=2">', version: '', size: '10 MB', url: 'https://u.pone.rs/vtdapejk.ipa' },
    { name: 'LCSign', icon: '<img src="' + ICON + 'IMG_0057.png?v=2">', version: '', size: '11 MB', url: 'https://u.pone.rs/eitilplw.ipa' },
    { name: 'Feather', icon: '<img src="' + ICON + 'IMG_0050.png?v=2">', version: '', size: '14,2 MB', url: 'https://u.pone.rs/wwanreyn.ipa' },
    { name: 'AirCard', icon: '<img src="' + ICON + 'IMG_0028.png?v=2">', version: '', size: '4,6 MB', url: 'https://u.pone.rs/sglbgmhz.ipa' },
    { name: 'Eagle', icon: '<img src="' + ICON + 'IMG_0355.png?v=2">', version: '', size: '18,3 MB', url: 'https://u.pone.rs/axzdqphr.ipa' },
    { name: 'Lara', icon: '<img src="' + ICON + 'IMG_0079.png?v=2">', version: '', size: '5,5 MB', url: 'https://u.pone.rs/rqppytmx.ipa' },
    { name: 'Cyanide', icon: '<img src="' + ICON + 'IMG_0357.png?v=2">', version: '', size: '6,5 MB', url: 'https://u.pone.rs/yorwrwcq.ipa' },
    { name: 'EnsWilde-iOS 18.x-18.7.4,26.0-26.2B1', icon: '<img src="' + ICON + 'IMG_0353.png?v=2">', version: '', size: '13,6 MB', url: 'https://u.pone.rs/yzcteqxb.ipa' },
    { name: 'Erosion', icon: '<img src="' + ICON + 'IMG_0358.png?v=2">', version: '', size: '5,4 MB', url: 'https://u.pone.rs/luyqnqqu.ipa' },
    { name: 'Ketamine', icon: '<img src="' + ICON + 'IMG_0356.png?v=2">', version: '', size: '23,9 MB', url: 'https://u.pone.rs/royllflc.ipa' },
    { name: 'GestaltEdit', icon: '<img src="' + ICON + 'IMG_0360.png?v=2">', version: '', size: '5,9 MB', url: 'https://u.pone.rs/bzfxwxws.ipa' },
    { name: 'Godis', icon: '<img src="' + ICON + 'IMG_0362.png?v=2">', version: '', size: '14,9 MB', url: 'https://u.pone.rs/cuohbfnu.ipa' },
    { name: 'Mond', icon: '<img src="' + ICON + 'IMG_0359.png?v=2">', version: '', size: '3,4 MB', url: 'https://u.pone.rs/jkbpfufw.ipa' },
  ];

  const OTHER_ITEMS = [
    { name: 'Mục Khác Mẫu', icon: '📦', version: '', size: 'Mô tả ngắn', url: 'https://github.com/nguyenls3005-cell/Ls-web/releases/download/other/FileA.zip' },
  ];

  function renderCards(containerId, items) {
    const el = document.getElementById(containerId);
    if (!el) return;
    if (!items || items.length === 0) {
      el.innerHTML = '<div style="text-align:center;padding:16px;color:#9a9aa2;font-size:0.75rem;">Chưa có gì</div>';
      return;
    }
    el.innerHTML = items.map(item => `
      <div class="card" data-name="${item.name}">
        <div class="icon">${item.icon || '📦'}</div>
        <div class="info">
          <h3>${item.name}</h3>
          <div class="meta">${item.version ? 'v' + item.version + ' • ' : ''}${item.size || ''}</div>
        </div>
        <a class="dl" href="${item.url}" target="_blank" rel="noopener">Tải</a>
      </div>
    `).join('');
  }

  renderCards('ipaGrid', IPA_APPS);
  renderCards('otherGrid', OTHER_ITEMS);

  const input = document.getElementById('searchInput');
  const sections = Array.from(document.querySelectorAll('.section'));
  const empty = document.getElementById('emptyMsg');

  input.addEventListener('input', () => {
    const q = input.value.trim().toLowerCase();
    let visibleTotal = 0;
    sections.forEach(sec => {
      let visibleInSection = 0;
      sec.querySelectorAll('.card').forEach(c => {
        const name = (c.dataset.name || '').toLowerCase();
        const match = name.includes(q);
        c.style.display = match ? 'flex' : 'none';
        if (match) visibleInSection++;
      });
      sec.style.display = visibleInSection === 0 ? 'none' : 'block';
      visibleTotal += visibleInSection;
    });
    empty.style.display = visibleTotal === 0 ? 'block' : 'none';
  });

  (async () => {
    const viewEl = document.getElementById('viewCount');
    if (!viewEl) return;
    try {
      const res = await fetch('https://api.counterapi.dev/v1/lsnguyen-lsweb/homepage/up');
      if (res.ok) {
        const data = await res.json();
        if (data && data.count) {
          viewEl.textContent = Number(data.count).toLocaleString('vi-VN');
          return;
        }
      }
    } catch (e) {}
    try {
      const res = await fetch('https://api.counterapi.dev/v1/lsnguyen-ipa/hits/up');
      if (res.ok) {
        const data = await res.json();
        if (data && data.count) {
          viewEl.textContent = Number(data.count).toLocaleString('vi-VN');
          return;
        }
      }
    } catch (e) {}
    try {
      const local = parseInt(localStorage.getItem('lsn_views') || '0', 10) + 1;
      localStorage.setItem('lsn_views', local);
      viewEl.textContent = local.toLocaleString('vi-VN');
    } catch (e2) {
      viewEl.textContent = '1';
    }
  })();
</script>
</body>
</html>
